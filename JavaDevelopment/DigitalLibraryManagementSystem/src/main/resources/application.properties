# --- Server ---
server.port=8080

# --- Database (H2 file-based, zero setup) ---
# The DB file is created at ./data/librarydb.mv.db the first time you run the app.
spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at /h2-console (username: sa, blank password) - handy for
# poking at the data directly while developing.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# ------------------------------------------------------------------
# To use MySQL instead of H2:
# 1. Uncomment the mysql-connector-j dependency in pom.xml
# 2. Replace the datasource block above with:
#
# spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# ------------------------------------------------------------------

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Digital Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<div class="container">
    <div class="card" style="max-width:520px;">
        <h1>Contact Us</h1>
        <p class="muted">Questions or issues? Send a message and the library admin will get back to you.</p>

        <div class="success" th:if="${success}">Thanks - your message has been sent to the library admin.</div>

        <form method="post" th:action="@{/user/contact}">
            <label>Your Name</label>
            <input type="text" name="name" required>
            <label>Email</label>
            <input type="email" name="email" required>
            <label>Message</label>
            <textarea name="message" rows="5" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </div>
</div>
</body>
</html>

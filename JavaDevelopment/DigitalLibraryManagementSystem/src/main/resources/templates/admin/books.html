<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Books - Digital Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>

<div class="container">
    <div class="card">
        <h1>Add a New Book</h1>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <form method="post" th:action="@{/admin/books/add}">
            <div style="display:grid; grid-template-columns: 2fr 1.5fr 1.5fr 1fr 0.7fr; gap:10px; align-items:end;">
                <div><label>Title</label><input type="text" name="title" required></div>
                <div><label>Author</label><input type="text" name="author" required></div>
                <div><label>ISBN</label><input type="text" name="isbn" required></div>
                <div><label>Category</label><input type="text" name="category" required></div>
                <div><label>Qty</label><input type="number" name="quantity" min="1" value="1" required></div>
            </div>
            <button type="submit">Add Book</button>
        </form>
    </div>

    <div class="card">
        <h1>Catalogue (<span th:text="${#lists.size(books)}"></span> titles)</h1>
        <table>
            <thead>
            <tr><th>Title</th><th>Author</th><th>Category</th><th>ISBN</th><th>Total</th><th>Available</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.category}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.quantity}"></td>
                <td th:text="${book.availableQuantity}"></td>
                <td style="white-space:nowrap;">
                    <details style="display:inline-block;">
                        <summary class="btn btn-small btn-secondary" style="display:inline-block; margin-top:0;">Edit</summary>
                        <form method="post" th:action="@{/admin/books/{id}/edit(id=${book.id})}"
                              style="margin-top:8px; min-width:260px;">
                            <label>Title</label>
                            <input type="text" name="title" th:value="${book.title}" required>
                            <label>Author</label>
                            <input type="text" name="author" th:value="${book.author}" required>
                            <label>ISBN</label>
                            <input type="text" name="isbn" th:value="${book.isbn}" required>
                            <label>Category</label>
                            <input type="text" name="category" th:value="${book.category}" required>
                            <label>Total Quantity</label>
                            <input type="number" name="quantity" min="0" th:value="${book.quantity}" required>
                            <button type="submit" class="btn-small">Save</button>
                        </form>
                    </details>
                    <form method="post" th:action="@{/admin/books/{id}/delete(id=${book.id})}" class="inline-form"
                          onsubmit="return confirm('Delete this book? This cannot be undone.');">
                        <button type="submit" class="btn-small btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(books)}"><td colspan="7" class="muted">No books yet - add one above.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
